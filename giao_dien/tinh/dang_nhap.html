<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập — Xưởng</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#27221c;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{background:#fffdfa;border:1px solid #e4d9cc;border-radius:20px;padding:36px;width:min(420px,92vw);box-shadow:0 10px 40px #3020000c}h1{margin-top:0}label{display:block;margin-top:18px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #d8cabb;border-radius:9px;margin-top:7px}button{background:#cb3d05;color:white;border:0;margin-top:24px;cursor:pointer}#error{color:#ae2e0a;min-height:24px}p{color:#7d7265}</style>
<main><h1>Đăng nhập</h1><p>Đăng nhập để mở xưởng của bạn.</p><form id="form"><label>Tài khoản<input id="username" autocomplete="username" required autofocus></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button id="submit">Vào xưởng</button><p id="error" role="alert"></p></form></main>
<script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#submit');b.disabled=true;try{const r=await fetch('/api/dang-nhap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Không đăng nhập được');location.replace('/'+location.hash);}catch(e){document.querySelector('#error').textContent=e.message;}finally{b.disabled=false;}});</script></html>
