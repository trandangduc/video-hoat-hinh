# Nhuong VRAM tren GPU1 cho shard TP=2 cua Qwen3.8-27B (:8000).
# bf16 util 0.85 = 27,0 GiB (trong so 15,3)  ->  fp8 util 0.36 = 11,5 GiB (trong so 7,9).
# 0.30 la THIEU: KV con -0,35 GiB. Do la san sau khi tru trong so + act + cudagraph.
# Go file nay + daemon-reload = quay ve y nguyen nhu cu (bf16, 0.85).
[Service]
Environment=EMBED_QUANT=fp8
Environment=GPU_UTIL=0.36
# BO cho :8000 len truoc. Thu tu cu la qwen36 (GPU0) roi moi den embed (GPU1),
# hai GPU roi nhau nen cho la de khong nghen disk. Gio qwen38 dung CA HAI GPU va
# phai khoi dong SAU khi embed da thu nho -> cho :8000 se treo dung 15 phut.
ExecStartPre=
